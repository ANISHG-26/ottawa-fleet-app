apiVersion: apps/v1
kind: Deployment
metadata:
  name: assignment-worker
  labels:
    {{- include "ottawa-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: assignment-worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ottawa-fleet.selectorLabels" (dict "root" . "component" "assignment-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ottawa-fleet.selectorLabels" (dict "root" . "component" "assignment-worker") | nindent 8 }}
      annotations:
        {{- include "ottawa-fleet.podAnnotations" (dict "root" . "image" .Values.images.worker) | nindent 8 }}
    spec:
      serviceAccountName: ottawa-fleet-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      {{- include "ottawa-fleet.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.global.securityContext | nindent 8 }}
      containers:
        - name: assignment-worker
          image: {{ include "ottawa-fleet.image" .Values.images.worker | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.ports.worker }}
              protocol: TCP
          env:
            {{- include "ottawa-fleet.databaseEnv" . | nindent 12 }}
            - name: FLEET_API_URL
              value: {{ printf "http://fleet-api:%v" .Values.ports.fleetApi | quote }}
            - name: HTTP_ADDR
              value: {{ printf ":%v" .Values.ports.worker | quote }}
            - name: BUILD_DIGEST
              value: {{ .Values.images.worker.digest | quote }}
            - name: PAUSE_AFTER_RESERVATION
              value: {{ ternary "1" "0" .Values.worker.pauseAfterReservation | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
