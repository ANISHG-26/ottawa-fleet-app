name: Go services checks

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "db/**"
      - ".github/workflows/services-checks.yml"
  pull_request:
    paths:
      - "services/**"
      - "db/**"
      - ".github/workflows/services-checks.yml"

permissions:
  contents: read

concurrency:
  group: services-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: services_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d services_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/services_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache-dependency-path: services/go.sum
      - name: Verify Go formatting
        shell: bash
        run: test -z "$(gofmt -l $(find services -name '*.go' -type f))"
      - name: Verify Go services
        working-directory: services
        run: |
          go vet ./...
          go test -p 1 ./...
