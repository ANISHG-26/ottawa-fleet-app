name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check documentation and configuration
        run: python3 scripts/check_repository.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract validators
        run: python -m pip install -r scripts/requirements-contracts.txt
      - name: Check generated contracts and positive/negative examples
        run: |
          python scripts/build_contracts.py --check
          python scripts/check_contracts.py
          python scripts/check_simulation_contracts.py --check-generated
          python -m unittest discover -s tests -p test_simulation_contracts.py
