server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the optional controller on demand; the v1 UI still starts when
    # the Compose simulation profile is not enabled.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /buildinfo {
        default_type application/json;
        alias /usr/share/nginx/html/buildinfo.json;
    }

    location /fleet-api/ {
        # Browser consumers read Fleet state; only owner services issue effects.
        limit_except GET { deny all; }
        proxy_pass http://fleet-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/ride-api/v2/ {
        limit_except GET { deny all; }
        rewrite ^/ride-api/(.*)$ /$1 break;
        proxy_pass http://ride-api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /ride-api/ {
        proxy_pass http://ride-api:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /simulation-api/ {
        set $simulation_controller simulation-controller:8083;
        rewrite ^/simulation-api/(.*)$ /$1 break;
        proxy_pass http://$simulation_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
