server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Generated from the container or pod's configured nameserver at startup.
    # The include lives in /tmp so this also works with a read-only root.
    include /tmp/ottawa-nginx-resolver.conf;

    location = /buildinfo {
        default_type application/json;
        alias /usr/share/nginx/html/buildinfo.json;
    }

    location = /runtime-config.json {
        default_type application/json;
        alias /tmp/ottawa-runtime-config.json;
        add_header Cache-Control "no-store" always;
    }

    location /fleet-api/ {
        # Browser consumers read Fleet state; only owner services issue effects.
        limit_except GET { deny all; }
        proxy_pass http://fleet-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/ride-api/v2/ {
        limit_except GET { deny all; }
        rewrite ^/ride-api/(.*)$ /$1 break;
        proxy_pass http://ride-api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /ride-api/ {
        proxy_pass http://ride-api:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /simulation-api/ {
        rewrite ^/simulation-api/(.*)$ /$1 break;
        proxy_pass http://$simulation_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
