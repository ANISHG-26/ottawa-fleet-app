name: ottawa-fleet-app

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleet}
      POSTGRES_USER: ${POSTGRES_USER:-fleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - fleet_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    networks: [app]

  db-init:
    build:
      context: ${APP_BUILD_CONTEXT:-..}
      dockerfile: deploy/Dockerfile.go
      args:
        APP_CMD: db-init
        BUILD_SERVICE: db-init
        BUILD_COMMIT: ${BUILD_COMMIT:-local}
        BUILD_ARCH: ${BUILD_ARCH:-local}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fleet}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-fleet}?sslmode=disable
      FLEET_SEED_TIME: ${FLEET_SEED_TIME:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [app]

  fleet-api:
    build:
      context: ${APP_BUILD_CONTEXT:-..}
      dockerfile: deploy/Dockerfile.go
      args:
        APP_CMD: fleet-api
        BUILD_SERVICE: fleet-api
        BUILD_COMMIT: ${BUILD_COMMIT:-local}
        BUILD_ARCH: ${BUILD_ARCH:-local}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fleet}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-fleet}?sslmode=disable
      HTTP_ADDR: :8080
      FLEET_FAULT_LATENCY_MS: ${FLEET_FAULT_LATENCY_MS:-0}
      FLEET_FAULT_ERROR_PERCENT: ${FLEET_FAULT_ERROR_PERCENT:-0}
      FLEET_FAULT_CONTROL: ${FLEET_FAULT_CONTROL:-0}
      FLEET_SYNTHETIC_OBSERVATIONS: ${FLEET_SYNTHETIC_OBSERVATIONS:-1}
      FLEET_OBSERVATION_INTERVAL_SECONDS: ${FLEET_OBSERVATION_INTERVAL_SECONDS:-10}
      BUILD_DIGEST: ${BUILD_DIGEST:-local}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks: [app]

  ride-api:
    build:
      context: ${APP_BUILD_CONTEXT:-..}
      dockerfile: deploy/Dockerfile.go
      args:
        APP_CMD: ride-api
        BUILD_SERVICE: ride-api
        BUILD_COMMIT: ${BUILD_COMMIT:-local}
        BUILD_ARCH: ${BUILD_ARCH:-local}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fleet}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-fleet}?sslmode=disable
      HTTP_ADDR: :8081
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks: [app]

  assignment-worker:
    build:
      context: ${APP_BUILD_CONTEXT:-..}
      dockerfile: deploy/Dockerfile.go
      args:
        APP_CMD: assignment-worker
        BUILD_SERVICE: assignment-worker
        BUILD_COMMIT: ${BUILD_COMMIT:-local}
        BUILD_ARCH: ${BUILD_ARCH:-local}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fleet}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-fleet}?sslmode=disable
      FLEET_API_URL: http://fleet-api:8080
      HTTP_ADDR: :8082
    depends_on:
      fleet-api:
        condition: service_healthy
      ride-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks: [app]

  web:
    build:
      context: ${APP_BUILD_CONTEXT:-..}
      dockerfile: deploy/Dockerfile.web
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      fleet-api:
        condition: service_healthy
      ride-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks: [app]

volumes:
  fleet_data:
    name: ottawa-fleet-app_fleet_data

networks:
  app:
    name: ottawa-fleet-app
    driver: bridge
